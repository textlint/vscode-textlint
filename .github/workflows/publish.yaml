name: Publish VS Code extension

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .tool-versions
      - name: Install dependencies
        run: npm ci
      - name: Package extension
        run: npm run package
      - name: Azure login using GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Marketplace access
        run: |
          publisher_id="$(node --print "require('./package.json').publisher")"
          test -n "$publisher_id"
          npx vsce verify-pat "$publisher_id" --azure-credential
      - name: Publish extension
        run: npx vsce publish --packagePath ./*.vsix --azure-credential
